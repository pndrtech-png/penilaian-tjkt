<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Assesmen TJKT - Login & Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @media print {
            .no-print,
            #auth-container,
            #app-container {
                display: none !important;
            }
            #printArea {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                color: #000 !important;
                background: #fff !important;
            }
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <div id="auth-container" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-gray-100">
            <div class="text-center mb-6">
                <div class="inline-flex bg-blue-100 p-4 rounded-full text-blue-900 mb-3">
                    <i class="fa-solid fa-user-shield text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Login Guru Penguji</h2>
                <p class="text-sm text-gray-400 mt-1">E-Assesmen Praktik TJKT</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Email Instansi</label>
                    <input type="email" id="loginEmail" class="w-full border p-2.5 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="nama@sekolah.sch.id" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-600">Password</label>
                    <input type="password" id="loginPassword" class="w-full border p-2.5 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnLogin" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-2.5 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk ke Sistem
                </button>
            </form>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <nav class="bg-blue-900 text-white shadow-md no-print">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-network-wired text-xl"></i>
                    <span class="text-lg font-bold tracking-wide">E-Assesmen TJKT</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="userDisplay" class="text-xs bg-blue-800 px-3 py-1.5 rounded-full font-medium">Penguji: -</span>
                    <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1.5 rounded-lg transition font-bold">
                        <i class="fa-solid fa-power-off mr-1"></i> Keluar
                    </button>
                </div>
            </div>
        </nav>

        <div class="container mx-auto px-4 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                <div class="lg:col-span-1 no-print">
                    <div class="bg-white rounded-2xl shadow-sm p-6 sticky top-6 border border-gray-100">
                        <h3 class="text-lg font-bold mb-4 text-blue-900 border-b pb-2 flex items-center gap-2">
                            <i class="fa-solid fa-square-poll-horizontal"></i> Input Capaian Siswa
                        </h3>
                        <form id="assessmentForm" onsubmit="handleSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Nama Siswa</label>
                                <input type="text" id="studentName" class="w-full border p-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="Nama lengkap siswa">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Tingkat Kelas</label>
                                <div class="flex gap-4 text-sm mt-1">
                                    <label class="flex items-center gap-1.5"><input type="radio" name="classLevel" value="X" onchange="updateElements()" class="text-blue-600"> Kelas X</label>
                                    <label class="flex items-center gap-1.5"><input type="radio" name="classLevel" value="XI" onchange="updateElements()" class="text-blue-600"> Kelas XI</label>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Elemen Kompetensi</label>
                                <select id="elementSelect" class="w-full border p-2 text-sm rounded-lg bg-gray-50" disabled required>
                                    <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
                                </select>
                            </div>

                            <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 grid grid-cols-2 gap-2">
                                <div class="col-span-2 text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1">Komponen Penilaian</div>
                                <div>
                                    <label class="block text-[11px] text-gray-600">Persiapan</label>
                                    <input type="number" id="scorePersiapan" min="0" max="100" class="w-full border p-1.5 rounded bg-white text-sm" placeholder="0" required>
                                </div>
                                <div>
                                    <label class="block text-[11px] text-gray-600">Pemasangan</label>
                                    <input type="number" id="scorePemasangan" min="0" max="100" class="w-full border p-1.5 rounded bg-white text-sm" placeholder="0" required>
                                </div>
                                <div>
                                    <label class="block text-[11px] text-gray-600">Konfigurasi</label>
                                    <input type="number" id="scoreKonfigurasi" min="0" max="100" class="w-full border p-1.5 rounded bg-white text-sm" placeholder="0" required>
                                </div>
                                <div>
                                    <label class="block text-[11px] text-gray-600">Hasil Output</label>
                                    <input type="number" id="scoreOutput" min="0" max="100" class="w-full border p-1.5 rounded bg-white text-sm" placeholder="0" required>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Foto Bukti Praktik Work/Crimping</label>
                                <input type="file" id="evidenceFile" accept=".jpg, .jpeg, .png" onchange="previewImage(event)" class="w-full text-xs text-gray-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">

                                <div class="mt-3">
                                    <img id="preview-foto" src="#" alt="Preview" class="hidden max-w-full h-auto rounded-xl border border-gray-200 shadow-sm p-1 bg-white max-h-48 object-contain">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Catatan Evaluasi / Feedback</label>
                                <textarea id="feedback" rows="2" class="w-full border p-2 text-sm rounded-lg" placeholder="Masukkan kendala atau catatan..."></textarea>
                            </div>

                            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 rounded-lg transition shadow flex items-center justify-center gap-2">
                                <i class="fa-solid fa-cloud-arrow-up"></i> Simpan Penilaian & Gambar
                            </button>
                        </form>
                    </div>
                </div>

                <div class="lg:col-span-2">
                    <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                        <div class="p-4 bg-gray-50 border-b flex justify-between items-center no-print">
                            <h4 class="font-bold text-gray-700 text-sm"><i class="fa-solid fa-database mr-1"></i> Data Tersimpan di Akun Anda</h4>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-100 text-[11px] text-gray-500 uppercase tracking-wider border-b">
                                        <th class="py-3 px-4">Informasi Siswa</th>
                                        <th class="py-3 px-2 text-center">Komponen</th>
                                        <th class="py-3 px-3 text-center font-bold text-blue-900">Rerata</th>
                                        <th class="py-3 px-2 text-center">Bukti</th>
                                        <th class="py-3 px-4 text-center no-print">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="scoreTableBody" class="text-xs divide-y divide-gray-100"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="printArea" style="display: none;"></div>

    <script>
        // ======= 1. FIREBASE CONFIGURATION =======
        const firebaseConfig = {
            apiKey: "AIzaSyDKRSzWSOBaVJOKQ61YouskX9-t84v4oE0",
            authDomain: "login-penguji.firebaseapp.com",
            databaseURL: "https://login-penguji-default-rtdb.firebaseio.com",
            projectId: "login-penguji",
            storageBucket: "login-penguji.firebasestorage.app",
            messagingSenderId: "912299351380",
            appId: "1:912299351380:web:07b1693bd5fcb1503bfcc1"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        } else {
            firebase.app();
        }

        const auth = firebase.auth();
        const rtdb = firebase.database();

        // ======= 2. STATE VARIABEL LOKAL =======
        const elementsData = {
            'X': ["Proses bisnis di bidang TJKT", "Perkembangan teknologi di bidang TJKT", "Profesi dan Kewirausahaan"],
            'XI': ["Teknologi Kabel dan Nirkabel", "Keamanan Jaringan", "Perencanaan dan Pengalamatan Jaringan"]
        };
        const KKM_LIMIT = 75;
        let localCacheData = [];
        let currentUserId = null;

        // ======= 3. MANAJEMEN SESSION LOGIN / AUTHENTICATION =======
        auth.onAuthStateChanged(user => {
            const authContainer = document.getElementById('auth-container');
            const appContainer = document.getElementById('app-container');
            const userDisplay = document.getElementById('userDisplay');

            if (user) {
                currentUserId = user.uid;
                if (authContainer) authContainer.classList.add('hidden');
                if (appContainer) appContainer.classList.remove('hidden');
                if (userDisplay) userDisplay.textContent = `Penguji: ${user.email}`;
                listenToRealtimeData();
            } else {
                currentUserId = null;
                if (authContainer) authContainer.classList.remove('hidden');
                if (appContainer) appContainer.classList.add('hidden');
                const tbody = document.getElementById('scoreTableBody');
                if (tbody) tbody.innerHTML = '';
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const btnLogin = document.getElementById('btnLogin');
            const originalText = btnLogin ? btnLogin.innerHTML : "Masuk ke Sistem";

            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;

            try {
                if (btnLogin) {
                    btnLogin.disabled = true;
                    btnLogin.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Mencoba Masuk...`;
                }
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (error) {
                if (btnLogin) {
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = originalText;
                }
                alert("Gagal Login!\nKode Error: " + error.code + "\nPesan: " + error.message);
                console.error("Firebase Auth Error:", error);
            }
        }

        async function handleLogout() {
            if (confirm("Keluar dari dashboard?")) {
                await auth.signOut();
            }
        }

        // ======= 4. UI SELECTION CONTROLLER =======
        function updateElements() {
            const checkedInput = document.querySelector('input[name="classLevel"]:checked');
            const cls = checkedInput ? checkedInput.value : null;
            const select = document.getElementById('elementSelect');

            if (!select) return;
            select.innerHTML = '<option value="">-- Pilih Elemen --</option>';
            if (cls && elementsData[cls]) {
                select.disabled = false;
                select.classList.remove('bg-gray-50');
                elementsData[cls].forEach(e => {
                    const opt = document.createElement('option');
                    opt.value = e;
                    opt.textContent = e;
                    select.appendChild(opt);
                });
            } else {
                select.disabled = true;
                select.classList.add('bg-gray-50');
            }
        }

        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('preview-foto');

            if (input && input.files && input.files[0] && preview) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            } else if (preview) {
                preview.src = "#";
                preview.classList.add('hidden');
            }
        }

        // ======= 5. SYNC REALTIME DATABASE =======
        function listenToRealtimeData() {
            if (!currentUserId) return;

            rtdb.ref('penilaian').orderByChild('instructorId').equalTo(currentUserId)
                .on('value', snapshot => {
                    const data = [];
                    snapshot.forEach(childSnapshot => {
                        data.push({
                            id: childSnapshot.key,
                            ...childSnapshot.val()
                        });
                    });
                    data.sort((a, b) => (b.id_num || 0) - (a.id_num || 0));
                    localCacheData = data;
                    renderTable(data);
                }, err => {
                    console.error("Database error:", err);
                });
        }

        async function handleSubmit(e) {
            e.preventDefault();
            if (!currentUserId) return alert("Sesi kadaluarsa, silakan login ulang!");

            const btnSubmit = document.getElementById('btnSubmit');
            const fileInput = document.getElementById('evidenceFile');

            const inputStudentName = document.getElementById('studentName').value.trim();
            const checkedInput = document.querySelector('input[name="classLevel"]:checked');
            const inputClassLevel = checkedInput ? checkedInput.value : null;
            const inputElement = document.getElementById('elementSelect').value;

            const p_prep = parseFloat(document.getElementById('scorePersiapan').value) || 0;
            const p_install = parseFloat(document.getElementById('scorePemasangan').value) || 0;
            const p_config = parseFloat(document.getElementById('scoreKonfigurasi').value) || 0;
            const p_out = parseFloat(document.getElementById('scoreOutput').value) || 0;
            const totalScore = (p_prep + p_install + p_config + p_out) / 4;
            const inputFeedback = document.getElementById('feedback').value.trim();

            let imageUrl = null;

            if (btnSubmit) {
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Memproses...`;
            }

            const convertFileToBase64 = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });

            try {
                if (fileInput && fileInput.files && fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    if (file.size > 500000) {
                        throw new Error("Ukuran foto terlalu besar! Gunakan foto di bawah 500 KB.");
                    }
                    imageUrl = await convertFileToBase64(file);
                }

                const idTimestamp = Date.now();

                await rtdb.ref('penilaian').push({
                    id_num: idTimestamp,
                    instructorId: currentUserId,
                    teacherId: currentUserId,
                    date: new Date().toLocaleDateString('id-ID'),
                    student: inputStudentName,
                    classLevel: inputClassLevel,
                    element: inputElement,
                    p_prep,
                    p_install,
                    p_config,
                    p_out,
                    score: totalScore,
                    feedback: inputFeedback,
                    evidenceUrl: imageUrl
                });

                document.getElementById('assessmentForm').reset();
                const sel = document.getElementById('elementSelect');
                if (sel) {
                    sel.disabled = true;
                    sel.classList.add('bg-gray-50');
                }
                const prv = document.getElementById('preview-foto');
                if (prv) {
                    prv.classList.add('hidden');
                    prv.src = "#";
                }

                alert('Data penilaian berhasil disimpan!');
            } catch (error) {
                console.error("Gagal simpan:", error);
                alert('Gagal menyimpan data: ' + error.message);
            } finally {
                if (btnSubmit) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Simpan Penilaian & Gambar`;
                }
            }
        }

        // ======= 6. RENDER INTERFACE TABEL REKAP =======
        function renderTable(data) {

            const tbody = document.getElementById('scoreTableBody');

            if (!tbody) return;

            tbody.innerHTML = '';

            if (data.length === 0) {

                tbody.innerHTML = `
            <tr>
                <td colspan="5" class="py-6 text-center text-gray-400 italic">
                    Belum ada riwayat penilaian tersimpan.
                </td>
            </tr>
        `;

                return;
            }

            data.forEach((item) => {

                const finalScore = parseFloat(item.score || 0);

                const scoreColor =
                    finalScore >= KKM_LIMIT ?
                    'text-green-600 font-bold' :
                    'text-red-500 font-bold';

                const identifier = item.id_num || item.id;

                const imgBadge = item.evidenceUrl ?
                    `
                <button
                    onclick="viewBypassImage('${item.id}')"
                    class="bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded-full hover:bg-blue-200 transition font-medium"
                >
                    <i class="fa-solid fa-image"></i> Lihat
                </button>
              ` :
                    `
                <span class="text-gray-300 text-[10px]">
                    Tidak ada
                </span>
              `;

                const tr = document.createElement('tr');

                tr.className = 'hover:bg-blue-50/40 text-xs transition';

                tr.innerHTML = `
            <td class="py-3 px-4">
                <div class="font-bold text-gray-800 text-sm">
                    ${item.student || '-'}
                </div>

                <div class="text-[10px] text-gray-400">
                    ${item.date || '-'} • Kelas ${item.classLevel || '-'}
                </div>

                <div
                    class="text-blue-800 font-medium truncate max-w-[200px]"
                    title="${item.element || ''}"
                >
                    ${item.element || '-'}
                </div>
            </td>

            <td class="py-3 px-2 text-center text-gray-500 text-[11px] leading-relaxed">
                P1:${item.p_prep ?? 0} |
                P2:${item.p_install ?? 0}<br>

                P3:${item.p_config ?? 0} |
                P4:${item.p_out ?? 0}
            </td>

            <td class="py-3 px-3 text-center text-sm bg-gray-50/50 ${scoreColor}">
                ${finalScore.toFixed(1)}
            </td>

            <td class="py-3 px-2 text-center">
                ${imgBadge}
            </td>

            <td class="py-3 px-4 text-center no-print space-x-2">

                <button
                    onclick="printSingle('${identifier}')"
                    class="text-blue-600 hover:text-blue-800 text-base"
                    title="Cetak"
                >
                    <i class="fa-solid fa-print"></i>
                </button>

                <button
                    onclick="deleteItem('${item.id}')"
                    class="text-red-500 hover:text-red-700 text-base"
                    title="Hapus"
                >
                    <i class="fa-solid fa-trash"></i>
                </button>

            </td>
        `;

                tbody.appendChild(tr);

            });
        }
        // ======= 7. ENGINE CETAK INDIVIDUAL =======
        function printSingle(idKey) {
            const item = localCacheData.find(d => d.id_num == idKey || d.id === String(idKey));
            if (!item) return alert("Data tidak ditemukan!");

            const printArea = document.getElementById('printArea');
            if (!printArea) return;

            printArea.innerHTML = `
                <div style="font-family: Arial, sans-serif; border: 2px solid #000; padding: 25px; border-radius: 6px; max-width: 750px; margin: 0 auto; color: #000; background: #fff;">
                    <h2 style="text-align: center; margin-bottom: 2px; font-size: 20px; font-weight: bold;">SMK BHAKTI INSANI BOGOR</h2>
                    <h3 style="text-align: center; margin-top: 0; border-bottom: 3px double #000; padding-bottom: 10px; font-size: 14px; font-weight: bold;">LEMBAR HASIL PENILAIAN PRAKTIK TJKT</h3>
                    
                    <table style="width: 100%; margin-top: 15px; margin-bottom: 20px; font-size: 13px;">
                        <tr><td style="width: 130px; padding: 2px 0;">Nama Siswa</td><td>: <b>${item.student || '-'}</b></td></tr>
                        <tr><td style="padding: 2px 0;">Kelas / Kompetensi</td><td>: Kelas ${item.classLevel || '-'} - Teknik Jaringan Komputer dan Telekomunikasi</td></tr>
                        <tr><td style="padding: 2px 0;">Elemen Pembelajaran</td><td>: ${item.element || '-'}</td></tr>
                        <tr><td style="padding: 2px 0;">Tanggal Uji</td><td>: ${item.date || '-'}</td></tr>
                    </table>
                    
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px;" border="1">
                        <thead>
                            <tr style="background-color: #f3f4f6;">
                                <th style="padding: 8px; text-align: left; border: 1px solid #000;">Komponen Penilaian Kejuruan</th>
                                <th style="padding: 8px; text-align: center; border: 1px solid #000; width: 100px;">Nilai</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td style="padding: 8px; border: 1px solid #000;">1. Langkah Persiapan Kerja</td><td style="text-align: center; border: 1px solid #000; font-weight: bold;">${item.p_prep ?? 0}</td></tr>
                            <tr><td style="padding: 8px; border: 1px solid #000;">2. Pemasangan Perangkat Fisik / Infrastruktur Kabel</td><td style="text-align: center; border: 1px solid #000; font-weight: bold;">${item.p_install ?? 0}</td></tr>
                            <tr><td style="padding: 8px; border: 1px solid #000;">3. Konfigurasi Sistem Operasi / Jaringan / Server</td><td style="text-align: center; border: 1px solid #000; font-weight: bold;">${item.p_config ?? 0}</td></tr>
                            <tr><td style="padding: 8px; border: 1px solid #000;">4. Pengujian Hasil Kerja / Troubleshoot Output</td><td style="text-align: center; border: 1px solid #000; font-weight: bold;">${item.p_out ?? 0}</td></tr>
                            <tr style="font-weight: bold; background-color: #e5e7eb;">
                                <td style="padding: 10px; border: 1px solid #000;">NILAI AKHIR (RATA-RATA)</td>
                                <td style="text-align: center; font-size: 16px; border: 1px solid #000;">${parseFloat(item.score || 0).toFixed(1)}</td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <div style="font-size: 13px; line-height: 1.5; margin-bottom: 35px;">
                        <p><b>Predikat Kelulusan:</b> <span style="font-weight: bold;">${(item.score || 0) >= KKM_LIMIT ? 'KOMPETEN' : 'BELUM KOMPETEN / REMEDIAL'}</span></p>
                        <p><b>Catatan Penguji:</b> <i>*${item.feedback || 'Tidak ada catatan khusus.'}</i></p>
                    </div>

                    <table style="width: 100%; font-size: 13px;">
                        <tr>
                            <td></td>
                            <td style="text-align: right; width: 220px;">
                                <p>Bogor, ${item.date || '-'}</p>
                                <br><br><br>
                                <p style="font-weight: bold; text-decoration: underline;">( ____________________ )</p>
                                <p style="font-size: 11px; color: #4b5563;">Guru Penguji Kompetensi</p>
                            </td>
                        </tr>
                    </table>
                </div>
            `;

            window.print();
        }



        async function deleteItem(id) {

            if (!confirm("Hapus rekap data penilaian siswa ini?")) {
                return;
            }

            try {

                await rtdb.ref(`penilaian/${id}`).remove();

                alert("Data berhasil dihapus");

            } catch (e) {

                console.error(e);

                alert("Gagal menghapus: " + e.message);
            }
        }
    </script>
