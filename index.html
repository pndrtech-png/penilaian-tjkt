                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }

<body class="text-gray-800">

    <!-- 🔐 LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-blue-900 bg-opacity-90 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-6">
                <i class="fa-solid fa-shield-halved text-4xl text-blue-600 mb-2"></i>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="email" id="loginEmail" placeholder="Email Guru" class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                <input type="password" id="loginPassword" placeholder="Password" class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition flex justify-center items-center">
                    <span id="loginText">Masuk</span>
                    <div id="loginLoader" class="loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-5 w-5 ml-2 hidden"></div>
                </button>
            </form>
            <p id="loginError" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <!-- 🖥️ MAIN APP -->
    <div id="appScreen" class="hidden min-h-screen flex flex-col">
        <nav class="bg-blue-900 text-white shadow-lg sticky top-0 z-40">
            <div class="container mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-network-wired text-xl"></i>
                    <span class="font-bold text-lg">E-Assesmen TJKT (Rubrik)</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm bg-blue-800 px-3 py-1 rounded-full" id="userEmailDisplay">...</span>
                    <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm transition">Logout</button>
                </div>
            </div>
        </nav>

        <div class="container mx-auto px-4 py-6 flex-grow">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

                <!-- KOLOM KIRI: Form Input Rubrik -->
                <div class="lg:col-span-5 space-y-6">
                    <div class="bg-white rounded-xl shadow-md p-6 border-t-4 border-blue-600">
                        <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center justify-between">
                            <span><i class="fa-solid fa-list-check mr-2 text-blue-600"></i> Form Penilaian</span>
                            <span id="totalScoreDisplay" class="text-2xl font-bold text-blue-600">0</span>
                        </h2>

                        <form id="assessmentForm" onsubmit="handleSubmit(event)">
                            <input type="hidden" id="editDocId">

                            <!-- Info Siswa -->
                            <div class="grid grid-cols-2 gap-3 mb-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Nama Siswa</label>
                                    <input type="text" id="studentName" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" required>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Tanggal</label>
                                    <input type="date" id="assessDate" class="w-full border p-2 rounded text-sm" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Kelas & Elemen</label>
                                <div class="flex space-x-2">
                                    <select id="classSelect" onchange="updateElements()" class="w-1/3 border p-2 rounded bg-gray-50 text-sm">
                                        <option value="">Kelas</option>
                                        <option value="X">Kelas X</option>
                                        <option value="XI">Kelas XI</option>
                                    </select>
                                    <select id="elementSelect" onchange="renderRubricForm()" class="w-2/3 border p-2 rounded bg-gray-50 text-sm" disabled>
                                        <option value="">-- Pilih Elemen --</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Area Rubrik Dinamis -->
                            <div id="rubricContainer" class="mb-4 space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                <p class="text-center text-gray-400 italic text-sm py-4">Pilih kelas dan elemen untuk melihat rubrik penilaian.</p>
                            </div>

                            <!-- Catatan & Bukti -->
                            <div class="mb-4">
                                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Catatan Guru</label>
                                <textarea id="feedback" rows="2" class="w-full border p-2 rounded text-sm"></textarea>
                            </div>

                            <div class="mb-6">
                                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Bukti Foto</label>
                                <input type="file" id="evidenceFile" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" onchange="previewImage(this)">
                                <img id="imagePreview" class="mt-2 w-full h-32 object-cover rounded-lg border hidden">
                                <button type="button" id="removeImgBtn" onclick="removeImage()" class="hidden text-xs text-red-500 mt-1 hover:underline">Hapus Foto</button>
                            </div>

                            <div class="flex space-x-2">
                                <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition shadow flex justify-center items-center">
                                    <span id="btnText">Simpan Nilai</span>
                                    <div id="btnLoader" class="loader ease-linear rounded-full border-2 border-t-2 border-white h-4 w-4 ml-2 hidden"></div>
                                </button>
                                <button type="button" onclick="resetForm()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded transition">Reset</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- KOLOM KANAN: Tabel & Stats -->
                <div class="lg:col-span-7 space-y-6">
                    <div class="grid grid-cols-3 gap-4">
                        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                            <p class="text-xs text-gray-500 uppercase">Total Data</p>
                            <p class="text-2xl font-bold text-gray-800" id="statTotal">0</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500">
                            <p class="text-xs text-gray-500 uppercase">Rata-rata Nilai</p>
                            <p class="text-2xl font-bold text-gray-800" id="statAvg">0</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-purple-500">
                            <p class="text-xs text-gray-500 uppercase">Siswa</p>
                            <p class="text-2xl font-bold text-gray-800" id="statStudents">0</p>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-md overflow-hidden flex flex-col h-[600px]">
                        <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                            <h2 class="text-lg font-bold text-gray-800">Riwayat Penilaian</h2>
                            <div class="flex space-x-2">
                                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Cari..." class="border p-2 rounded text-sm w-32">
                                <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-700 text-white text-sm px-3 py-2 rounded shadow"><i class="fa-solid fa-file-excel"></i></button>
                            </div>
                        </div>
                        <div class="overflow-auto flex-grow">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-gray-100 sticky top-0 z-10">
                                    <tr class="text-gray-600 uppercase text-xs">
                                        <th class="py-3 px-4">Siswa/Kelas</th>
                                        <th class="py-3 px-4">Elemen</th>
                                        <th class="py-3 px-4 text-center">Nilai Akhir</th>
                                        <th class="py-3 px-4">Bukti</th>
                                        <th class="py-3 px-4 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="scoreTableBody" class="text-sm divide-y divide-gray-100"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚙️ CONFIG FIREBASE (GANTI DENGAN PUNYA ANDA)
        const firebaseConfig = {
            apiKey: "AIzaSyAB4bfZCSHuhTL2mXBVb3ppRh_K0EWCQfQ",
            authDomain: "tjkt-asesmen.firebaseapp.com",
            projectId: "tjkt-asesmen",
            storageBucket: "tjkt-asesmen.firebasestorage.app",
            messagingSenderId: "281854375632",
            appId: "1:281854375632:web:7e548fe9830c37cacd90d5"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // --- DATABASE RUBRIK LENGKAP ---
        const rubricDatabase = {
            "XI": {
                "Keamanan Jaringan": [{
                        aspect: "Persiapan konfigurasi",
                        weight: 10
                    }, {
                        aspect: "Block SSH (Port 22)",
                        weight: 25
                    }, {
                        aspect: "Block Web (Port 80/443)",
                        weight: 15
                    }, {
                        aspect: "Troubleshooting",
                        weight: 15
                    }, {
                        aspect: "Pengujian hasil konfigurasi",
                        weight: 15
                    }, {
                        aspect: "Sikap & Kerapihan Kerja",
                        weight: 10
                    }, {
                        aspect: "Nilai Akhir (Max 100)",
                        weight: 10
                    } // Normalisasi bobot sisa jika total > 100 atau sebagai penutup
                ],
                "Perencanaan & Pengalamatan": [{
                        aspect: "Desain topologi jaringan",
                        weight: 15
                    }, {
                        aspect: "Konfigurasi DHCP Server",
                        weight: 15
                    }, {
                        aspect: "Konfigurasi DNS Server",
                        weight: 15
                    }, {
                        aspect: "Konfigurasi FTP Server",
                        weight: 15
                    }, {
                        aspect: "Konektivitas antar perangkat (Ping)",
                        weight: 10
                    }, {
                        aspect: "Pengujian layanan DNS dan FTP",
                        weight: 10
                    } // Total 80%? Asumsi sisa 20% untuk sikap/laporan implisit, atau user adjust. Saya set sesuai prompt.
                ],
                "Teknologi Kabel & Nirkabel": [{
                    aspect: "Reset dan persiapan perangkat",
                    weight: 10
                }, {
                    aspect: "Konfigurasi IP Address perangkat",
                    weight: 15
                }, {
                    aspect: "Konfigurasi SSID dan keamanan WiFi",
                    weight: 20
                }, {
                    aspect: "Integrasi AP dengan Mikrotik",
                    weight: 20
                }, {
                    aspect: "Koneksi client ke jaringan WiFi",
                    weight: 15
                }, {
                    aspect: "Pengujian akses internet",
                    weight: 10
                }, {
                    aspect: "Troubleshooting gangguan koneksi",
                    weight: 10
                }]
            },
            "X": {
                "Proses Bisnis TJKT": [{
                    aspect: "Analisis kebutuhan pelanggan",
                    weight: 15
                }, {
                    aspect: "Perencanaan jaringan LAN",
                    weight: 15
                }, {
                    aspect: "Pembuatan topologi jaringan",
                    weight: 15
                }, {
                    aspect: "Implementasi/pemasangan jaringan LAN",
                    weight: 20
                }, {
                    aspect: "Pengujian konektivitas jaringan",
                    weight: 15
                }, {
                    aspect: "Pelayanan & komunikasi pelanggan",
                    weight: 10
                }, {
                    aspect: "Dokumentasi & laporan pekerjaan",
                    weight: 10
                }],
                "Profesi & Kewirausahaan": [{
                    aspect: "Pemilihan jenis usaha bidang TJKT",
                    weight: 15
                }, {
                    aspect: "Kreativitas desain logo",
                    weight: 20
                }, {
                    aspect: "Kesesuaian logo dengan usaha",
                    weight: 20
                }, {
                    aspect: "Penggunaan fitur Canva",
                    weight: 15
                }, {
                    aspect: "Kerapihan & estetika desain",
                    weight: 20
                }, {
                    aspect: "Ketepatan format pengumpulan",
                    weight: 10
                }],
                "Perkembangan Teknologi (IoT)": [{
                    aspect: "Persiapan alat dan bahan",
                    weight: 10
                }, {
                    aspect: "Ketepatan pemasangan rangkaian Arduino",
                    weight: 20
                }, {
                    aspect: "Ketepatan pemasangan LED Traffic Light",
                    weight: 15
                }, {
                    aspect: "Penulisan program Arduino IDE",
                    weight: 20
                }, {
                    aspect: "Proses upload program",
                    weight: 10
                }, {
                    aspect: "Keberhasilan simulasi Traffic Light",
                    weight: 15
                }, {
                    aspect: "Troubleshooting & presentasi",
                    weight: 10
                }]
            }
        };

        let currentUser = null;
        let allAssessments = [];
        let currentImageFile = null;
        let existingImageUrl = null;

        // --- AUTH ---
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('userEmailDisplay').textContent = user.email;
                document.getElementById('assessDate').valueAsDate = new Date();
                loadAssessments();
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('appScreen').classList.add('hidden');
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const loader = document.getElementById('loginLoader');
            const txt = document.getElementById('loginText');
            const err = document.getElementById('loginError');

            btn.disabled = true;
            loader.classList.remove('hidden');
            txt.textContent = "...";
            try {
                await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
            } catch (error) {
                err.textContent = "Login Gagal: " + error.message;
                err.classList.remove('hidden');
                btn.disabled = false;
                loader.classList.add('hidden');
                txt.textContent = "Masuk";
            }
        }

        function handleLogout() {
            auth.signOut();
            location.reload();
        }

        // --- FORM LOGIC ---
        function updateElements() {
            const cls = document.getElementById('classSelect').value;
            const elemSelect = document.getElementById('elementSelect');
            elemSelect.innerHTML = '<option value="">-- Pilih Elemen --</option>';

            if (cls && rubricDatabase[cls]) {
                elemSelect.disabled = false;
                Object.keys(rubricDatabase[cls]).forEach(key => {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = key;
                    elemSelect.appendChild(opt);
                });
            } else {
                elemSelect.disabled = true;
            }
            document.getElementById('rubricContainer').innerHTML = '<p class="text-center text-gray-400 italic text-sm py-4">Pilih elemen untuk melihat rubrik.</p>';
            calculateTotal();
        }

        function renderRubricForm() {
            const cls = document.getElementById('classSelect').value;
            const elem = document.getElementById('elementSelect').value;
            const container = document.getElementById('rubricContainer');
            container.innerHTML = '';

            if (!cls || !elem) return;

            const aspects = rubricDatabase[cls][elem];
            aspects.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-gray-50 p-2 rounded border border-gray-200";
                div.innerHTML = `
                    <div class="flex-1">
                        <p class="text-sm font-medium text-gray-700">${item.aspect}</p>
                        <p class="text-xs text-blue-600 font-bold">Bobot: ${item.weight}%</p>
                    </div>
                    <div class="w-20">
                        <input type="number" min="0" max="100" class="rubric-input w-full border p-1 rounded text-center font-bold" 
                               data-weight="${item.weight}" oninput="calculateTotal()" placeholder="0-100">
                    </div>
                `;
                container.appendChild(div);
            });
            calculateTotal();
        }

        function calculateTotal() {
            const inputs = document.querySelectorAll('.rubric-input');
            let totalWeightedScore = 0;
            let totalWeightUsed = 0;

            inputs.forEach(input => {
                const val = parseFloat(input.value) || 0;
                const weight = parseFloat(input.dataset.weight);
                totalWeightedScore += (val * (weight / 100));
                totalWeightUsed += weight;
            });

            // Jika total bobot tidak 100%, kita normalisasi atau tampilkan apa adanya. 
            // Untuk kasus prompt, beberapa total bobot != 100. Kita asumsikan nilai akhir adalah akumulasi langsung.
            // Namun, agar adil, biasanya dibagi total bobot. Di sini saya tampilkan Accumulated Score.

            const finalScore = Math.round(totalWeightedScore);
            document.getElementById('totalScoreDisplay').textContent = finalScore;

            // Ubah warna skor
            const display = document.getElementById('totalScoreDisplay');
            if (finalScore >= 80) display.className = "text-2xl font-bold text-green-600";
            else if (finalScore >= 65) display.className = "text-2xl font-bold text-yellow-600";
            else display.className = "text-2xl font-bold text-red-600";
        }

        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            if (input.files && input.files[0]) {
                currentImageFile = input.files[0];
                const reader = new FileReader();
                reader.onload = e => {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    document.getElementById('removeImgBtn').classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function removeImage() {
            document.getElementById('evidenceFile').value = "";
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('removeImgBtn').classList.add('hidden');
            currentImageFile = null;
            existingImageUrl = null;
        }

        function resetForm() {
            document.getElementById('assessmentForm').reset();
            document.getElementById('editDocId').value = "";
            document.getElementById('rubricContainer').innerHTML = '<p class="text-center text-gray-400 italic text-sm py-4">Pilih kelas dan elemen...</p>';
            document.getElementById('totalScoreDisplay').textContent = "0";
            document.getElementById('totalScoreDisplay').className = "text-2xl font-bold text-blue-600";
            document.getElementById('elementSelect').disabled = true;
            document.getElementById('assessDate').valueAsDate = new Date();
            removeImage();
        }

        // --- SUBMIT & CRUD ---
        async function handleSubmit(e) {
            e.preventDefault();
            if (!currentUser) return alert('Login required');

            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('btnLoader');
            const txt = document.getElementById('btnText');

            btn.disabled = true;
            loader.classList.remove('hidden');
            txt.textContent = "Saving...";

            try {
                const docId = document.getElementById('editDocId').value;
                const student = document.getElementById('studentName').value.trim();
                const classLevel = document.getElementById('classSelect').value;
                const element = document.getElementById('elementSelect').value;
                const finalScore = parseInt(document.getElementById('totalScoreDisplay').textContent);
                const feedback = document.getElementById('feedback').value.trim();
                const date = document.getElementById('assessDate').value;

                // Collect Rubric Details
                const rubricDetails = [];
                document.querySelectorAll('.rubric-input').forEach(input => {
                    rubricDetails.push({
                        aspect: input.parentElement.previousElementSibling.innerText.split('\n')[0], // Get aspect name
                        score: input.value,
                        weight: input.dataset.weight
                    });
                });

                if (!classLevel || !element) throw new Error('Lengkapi data kelas & elemen!');

                let finalImageUrl = existingImageUrl || '';
                if (currentImageFile) {
                    const path = `bukti/${currentUser.uid}/${Date.now()}_${student.replace(/\s/g,'_')}.jpg`;
                    const ref = storage.ref().child(path);
                    await ref.put(currentImageFile);
                    finalImageUrl = await ref.getDownloadURL();
                }

                const payload = {
                    teacherId: currentUser.uid,
                    student,
                    classLevel,
                    element,
                    finalScore,
                    rubricDetails,
                    feedback,
                    date,
                    imageUrl: finalImageUrl,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                if (docId) {
                    await db.collection('penilaian').doc(docId).update(payload);
                } else {
                    payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('penilaian').add(payload);
                }

                resetForm();
                alert('✅ Data tersimpan!');

            } catch (err) {
                alert('❌ Error: ' + err.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
                txt.textContent = "Simpan Nilai";
            }
        }

        function loadAssessments() {
            db.collection('penilaian').where('teacherId', '==', currentUser.uid).orderBy('createdAt', 'desc')
                .onSnapshot(snapshot => {
                    const data = [];
                    snapshot.forEach(doc => data.push({
                        id: doc.id,
                        ...doc.data()
                    }));
                    allAssessments = data;
                    renderTable(data);
                    updateStats(data);
                });
        }

        function renderTable(data) {
            const tbody = document.getElementById('scoreTableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            tbody.innerHTML = '';

            const filtered = data.filter(item => item.student.toLowerCase().includes(search));

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-gray-400">Belum ada data.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                let scoreColor = item.finalScore >= 80 ? 'bg-green-100 text-green-700' : item.finalScore >= 65 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700';
                let imgHtml = item.imageUrl ?
                    `<img src="${item.imageUrl}" class="w-8 h-8 object-cover rounded cursor-pointer hover:scale-150 transition" onclick="window.open('${item.imageUrl}')">` :
                    `-`;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-blue-50 border-b';
                tr.innerHTML = `
                    <td class="py-3 px-4">
                        <div class="font-bold">${item.student}</div>
                        <div class="text-xs text-gray-500">Kelas ${item.classLevel}</div>
                    </td>
                    <td class="py-3 px-4 text-xs max-w-[150px] truncate">${item.element}</td>
                    <td class="py-3 px-4 text-center">
                        <span class="${scoreColor} py-1 px-3 rounded-full text-xs font-bold">${item.finalScore}</span>
                    </td>
                    <td class="py-3 px-4 text-center">${imgHtml}</td>
                    <td class="py-3 px-4 text-center space-x-2">
                        <button onclick='editItem(${JSON.stringify(item).replace(/'/g, "&#39;")})' class="text-blue-500 bg-blue-50 p-2 rounded"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteItem('${item.id}')" class="text-red-500 bg-red-50 p-2 rounded"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterTable() {
            renderTable(allAssessments);
        }

        function editItem(item) {
            document.getElementById('editDocId').value = item.id;
            document.getElementById('studentName').value = item.student;
            document.getElementById('classSelect').value = item.classLevel;
            updateElements(); // Load options
            document.getElementById('elementSelect').value = item.element;
            renderRubricForm(); // Load inputs

            // Fill Scores
            if (item.rubricDetails) {
                const inputs = document.querySelectorAll('.rubric-input');
                item.rubricDetails.forEach((det, idx) => {
                    if (inputs[idx]) inputs[idx].value = det.score;
                });
            }

            document.getElementById('feedback').value = item.feedback || '';
            document.getElementById('assessDate').value = item.date;
            calculateTotal();

            existingImageUrl = item.imageUrl;
            if (item.imageUrl) {
                document.getElementById('imagePreview').src = item.imageUrl;
                document.getElementById('imagePreview').classList.remove('hidden');
                document.getElementById('removeImgBtn').classList.remove('hidden');
            } else {
                removeImage();
            }

            document.getElementById('btnText').textContent = "Update Data";
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        async function deleteItem(id) {
            if (!confirm('Hapus data?')) return;
            await db.collection('penilaian').doc(id).delete();
        }

        function updateStats(data) {
            document.getElementById('statTotal').textContent = data.length;
            const unique = [...new Set(data.map(i => i.student))];
            document.getElementById('statStudents').textContent = unique.length;
            const avg = data.length ? (data.reduce((sum, i) => sum + i.finalScore, 0) / data.length).toFixed(1) : 0;
            document.getElementById('statAvg').textContent = avg;
        }

        function exportToExcel() {
            if (!allAssessments.length) return alert("Data kosong");
            const data = allAssessments.map(i => ({
                "Tanggal": i.date,
                "Siswa": i.student,
                "Kelas": i.classLevel,
                "Elemen": i.element,
                "Nilai Akhir": i.finalScore,
                "Feedback": i.feedback
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekap Nilai");
            XLSX.writeFile(wb, `Rekap_TJKT_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>

</html>
